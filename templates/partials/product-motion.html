<div class="product-motion" data-product-motion role="group" aria-label="Mother Tonic interactive product view">
  <div class="product-motion__stage">
    <img class="product-motion__image" src="/images/wasay/mother-tonic-motion/036.webp" alt="Mother Tonic 50 gm jar" width="280" height="384" loading="lazy" draggable="false" />
  </div>
  <div class="product-motion__controls" hidden>
    <button class="product-motion__play" type="button" aria-label="Pause product animation">Pause</button>
    <label class="product-motion__angle">Turn
      <input type="range" min="0" max="72" value="36" aria-label="Turn Mother Tonic" aria-valuetext="Front view" />
    </label>
    <button class="product-motion__reset" type="button">Front</button>
  </div>
  <p class="product-motion__hint" hidden>Move across or drag to turn</p>
</div>
