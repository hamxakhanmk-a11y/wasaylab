<!-- PRODUCT VIEW: opens when a product is clicked, on the home ring and on every product tab. The name rises from behind the
     product, which tilts as the page is scrolled; static/wasay-detail.js fills it in from the clicked product's data attributes. -->
{{#each site.product_view.kinds}}<template data-pv-kind="{{ key }}" data-range="{{ range }}" data-pack="{{ pack }}" data-noun="{{ noun }}" data-all-label="{{ all_label }}" data-all-href="{{ all_href }}"></template>
{{/each}}
{{#each content.catalog.all}}
<template data-pv-copy="{{ slug }}">
  <section class="wz-detail__facts" aria-label="{{ site.product_view.facts_heading }}">
    <dl>
      <div><dt>{{ site.product_view.range_label }}</dt><dd>{{ range }}</dd></div>
      <div><dt>{{ site.product_view.size_label }}</dt><dd>{{ detail }}</dd></div>
      <div><dt>{{ site.product_view.pack_label }}</dt><dd>{{#if jar}}{{ site.product_view.pack_jar }}{{else}}{{ site.product_view.pack_carton }}{{/if}}</dd></div>
      <div><dt>{{ site.product_view.made_label }}</dt><dd>{{ site.product_view.made_value }}</dd></div>
    </dl>
  </section>
  <section class="wz-detail__section">
    <h3>{{ site.product_view.about_heading }}</h3>
    <div><p>{{ about }}</p></div>
  </section>
  {{#if uses}}<section class="wz-detail__section">
    <h3>{{ site.product_view.uses_heading }}</h3>
    <div><ul>{{#each uses}}<li>{{ . }}</li>{{/each}}</ul></div>
  </section>{{/if}}
  {{#if ingredients}}<section class="wz-detail__section">
    <h3>{{#if partial_composition}}{{ site.product_view.key_ingredients_heading }}{{else}}{{ site.product_view.composition_heading }}{{/if}}</h3>
    <div><ul class="wz-detail__ingredients">{{#each ingredients}}<li>{{ . }}</li>{{/each}}</ul></div>
  </section>{{/if}}
  {{#if related}}<section class="wz-detail__more">
    <h3>{{ site.product_view.related_heading }} <span>{{ range }}</span></h3>
    <ul>{{#each related}}<li><a href="{{ tab }}.html#product-{{ slug }}" data-pv-go="{{ slug }}"><span class="wz-detail__more-pic"><img src="{{ ring_image }}" alt="" loading="lazy" decoding="async" /></span><b>{{ name }}</b><span>{{ detail }}</span></a></li>{{/each}}</ul>
    <a class="wz-link" href="{{ range_href }}">{{ site.product_view.range_link }} {{ range }} &rarr;</a>
  </section>{{/if}}
</template>
{{/each}}
    <dialog class="wz-detail" aria-labelledby="wz-detail-name" data-product-view>
      <button class="wz-detail__back" type="button" data-detail-close aria-label="{{ site.product_view.close_label }}"><span aria-hidden="true">&larr;</span> {{ site.product_view.back_label }}</button>
      <div class="wz-detail__hero" data-detail-hero>
        <div class="wz-detail__stick">
          <div class="wz-detail__title"><h2 class="wz-detail__name" id="wz-detail-name" data-fill="name"></h2></div>
          <p class="wz-detail__cap wz-detail__cap--l" data-fill="range"></p>
          <p class="wz-detail__cap wz-detail__cap--r" data-fill="detail"></p>
          <div class="wz-detail__stage"><img class="wz-detail__jar" alt="" width="570" height="1000" data-detail-jar /></div>
        </div>
      </div>
      <div class="wz-detail__body">
        <div data-detail-copy></div>
        <nav class="wz-detail__nav" aria-label="{{ site.product_view.nav_label }}">
          <button type="button" data-detail-step="-1"><span aria-hidden="true">&larr;</span> {{ site.product_view.prev_label }}: <b data-detail-neighbour="-1"></b></button>
          <a href="pastes.html" data-pv-all data-fill="all_label"></a>
          <button type="button" data-detail-step="1">{{ site.product_view.next_label }}: <b data-detail-neighbour="1"></b> <span aria-hidden="true">&rarr;</span></button>
        </nav>
      </div>
    </dialog>
