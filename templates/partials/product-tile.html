<li class="tablet-item" data-pv-item data-slug="{{ slug }}" data-name="{{ name }}" data-detail="{{ detail }}" data-kind="{{ tab }}" data-img="{{ large }}" data-photos="{{ photos_json }}">{{#if jar}}{{#if motion}}{{> product-motion}}{{else}}<div class="paste-view" data-paste="{{ slug }}" tabindex="0" role="group" aria-label="{{ name }} jar. Use left and right arrow keys to turn."><img class="tablet-fallback" src="{{ image }}" alt="{{ name }} jar" loading="lazy" /><canvas width="420" height="560" aria-hidden="true"></canvas></div>{{/if}}{{else}}<div class="tablet-view" data-tablet="{{ slug }}" tabindex="0" role="group" aria-label="{{ name }} carton. Use left and right arrow keys to turn."><img class="tablet-fallback" src="{{ image }}" alt="{{ name }} carton" loading="lazy" /><div class="tablet-float"><div class="tablet-model"></div></div></div>{{/if}}<h3><a href="#product-{{ slug }}" data-pv-link>{{ name }}</a></h3><p>{{ detail }}</p></li>
