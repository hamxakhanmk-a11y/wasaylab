  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="icon" type="image/png" href="{{ site.favicon }}" />
  <link rel="apple-touch-icon" href="{{ site.favicon }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/wasay.css" />
  <link rel="stylesheet" href="/wasay-stack.css" />
  <script src="/wasay-stack.js" defer></script>

  <script>
    try {
      const pending = JSON.parse(sessionStorage.getItem('site-tab-navigation') || 'null');
      sessionStorage.removeItem('site-tab-navigation');
      if (pending && pending.path === location.pathname && Date.now() - pending.time < 15000) {
        document.documentElement.classList.add('tab-navigation');
      }
    } catch {}
  </script>
