# Sveltia CMS: the editor behind /admin on the Wasay Laboratories site.
#
# Saving here commits to the `main` branch on GitHub, which triggers a deploy.
#
# BEFORE THE EDITOR WILL WORK: replace both REPLACE-WITH-SITE-DOMAIN values below with the
# address this site is deployed at (see README, "Publishing and the editor").

backend:
  name: github
  repo: hamxakhanmk-a11y/wasaylab
  branch: main
  # Points at the OAuth endpoints in /api. See api/auth.js and api/callback.js.
  base_url: https://REPLACE-WITH-SITE-DOMAIN
  auth_endpoint: api/auth

site_url: https://REPLACE-WITH-SITE-DOMAIN
publish_mode: simple

# Photos live in the repo here and are served from /images.
media_folder: static/images
public_folder: /images

collections:
  - name: content
    label: Website content
    editor:
      preview: false
    files:
      # ---------------------------------------------------------------- shared
      - name: site
        label: Shared: menu and footer
        file: content/site.json
        description: Used on every page. Change it once and it updates site-wide.
        fields:
          - { name: name, label: Company name (used for logo descriptions), widget: string }
          - { name: logo, label: Logo, widget: image }
          - { name: favicon, label: Favicon (browser tab icon), widget: image }
          - name: shop
            label: Online shop
            widget: object
            fields:
              - { name: url, label: Shop address, widget: string }
              - { name: home_url, label: Main website address, widget: string }
          - name: nav
            label: Top menu
            widget: object
            fields:
              - name: links
                label: Menu items
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Links to, widget: string, hint: 'e.g. about.html' }
                  - name: slug
                    label: Page it belongs to
                    widget: select
                    options: [index, products, about]
                    hint: Used to highlight this item when you are on that page.
              - name: cta
                label: Menu button
                widget: object
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Links to, widget: string }
                  - { name: external, label: Opens in a new tab, widget: boolean, default: true }
                  - { name: desktop_only, label: Only on desktop, widget: boolean, default: true }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: blurb, label: Blurb under the logo, widget: text }
              - { name: company_heading, label: First column heading, widget: string }
              - name: company_links
                label: First column links
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Links to, widget: string }
              - { name: shop_heading, label: Second column heading, widget: string }
              - name: shop_links
                label: Second column links
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Links to, widget: string }
              - { name: copyright, label: Copyright line, widget: string, hint: 'The year and © are added automatically.' }
              - { name: tagline, label: Closing line, widget: string }

          - name: product_view
            label: Product view (opens when any product is clicked)
            widget: object
            hint: 'Use {name}, {detail}, {range}, {pack} in any text where the product''s own words should appear.'
            fields:
              - { name: back_label, label: Back button text, widget: string }
              - { name: close_label, label: Back button description for screen readers, widget: string }
              - { name: intro, label: Paragraph under the product, widget: text }
              - { name: specs_heading, label: Specifications heading, widget: string }
              - name: specs
                label: Specifications
                widget: list
                summary: '{{fields.label}}: {{fields.value}}'
                hint: Add rows such as composition once Wasay supplies them.
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string }
              - { name: photos_heading, label: Photos heading, widget: string }
              - { name: prev_label, label: Previous button text, widget: string }
              - { name: next_label, label: Next button text, widget: string }
              - { name: nav_label, label: Previous / next description for screen readers, widget: string }
              - name: kinds
                label: Product ranges
                widget: list
                summary: '{{fields.range}}'
                fields:
                  - { name: key, label: Key (do not change), widget: string }
                  - { name: range, label: Range name, widget: string }
                  - { name: pack, label: Pack type, widget: string }
                  - { name: noun, label: Pack word (jar, carton), widget: string }
                  - { name: photos_note, label: Photos caption, widget: string }
                  - { name: all_label, label: Link text to the whole range, widget: string }
                  - { name: all_href, label: Link goes to, widget: string }
      # ------------------------------------------------------------ home page
      - name: index
        label: Home page
        file: content/index.json
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: hero
            label: 'Section: Opening banner'
            widget: object
            fields:
              - { name: image, label: Banner photo (wide, with an empty left side for the text), widget: image }
              - { name: image_mobile, label: Banner photo for phones (square, empty top half), widget: image }
              - { name: alt, label: Photo description, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: lead, label: Line under the heading, widget: string }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }
          - name: ring
            label: 'Section: Product ring (under the opening banner)'
            widget: object
            hint: The jars come from the Pastes page. Each needs pictures in static/images/wasay/ring, made with scripts/render-cutouts.mjs.
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: label, label: Description for screen readers, widget: text }
              - { name: arch_text, label: Words curved along the arch, widget: string }
              - { name: link_label, label: Button text, widget: string }
              - { name: link_href, label: Button links to, widget: string }
          - name: about
            label: 'Section: Who we are'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: points, label: Bullet points, widget: list }
              - { name: button_label, label: Button text, widget: string }
              - { name: button_href, label: Button links to, widget: string }
              - name: media
                label: Photo
                widget: object
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: alt, label: Photo description, widget: string }
          - { name: marquee, label: Scrolling ticker, widget: list, hint: 'The category names that scroll past. Repeats automatically.' }
          - name: looking_for
            label: 'Section: I’m looking for'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Category tiles
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Name, widget: string }
                  - { name: icon, label: Icon, widget: image }
                  - { name: href, label: Links to, widget: string }
          - name: featured
            label: 'Section: Featured categories'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: lead, label: Paragraph, widget: text }
              - { name: card_label, label: Link text on each card, widget: string }
              - name: items
                label: Categories
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Name, widget: string }
                  - { name: image, label: Photo (optional), widget: image, required: false }
                  - { name: alt, label: Photo description, widget: string, required: false }
                  - { name: href, label: Links to, widget: string }
          - name: best_sellers
            label: 'Section: Best selling (products come from the Products page)'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: button_label, label: Button text, widget: string }
              - { name: button_href, label: Button links to, widget: string }
          - name: love
            label: 'Section: Why customers love Wasay'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
          - name: why
            label: 'Section: Why choose Wasay'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Reasons
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: cta
            label: 'Section: Closing call to action'
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }

      # ---------------------------------------------------------- products page
      - name: products
        label: Products page (also feeds the home page best sellers)
        file: content/products.json
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: banner
            label: Page banner
            widget: object
            fields:
              - { name: crumb, label: Breadcrumb text, widget: string }
              - { name: heading, label: Heading, widget: string }
          - name: intro
            label: Introduction
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
          - { name: order_label, label: Order link text, widget: string }
          - name: items
            label: Products (the first three show large, the rest side by side)
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Photo description, widget: string }
              - { name: detail, label: Short detail line, widget: string, hint: 'e.g. 120 ml syrup' }
              - { name: description, label: Longer description (optional), widget: text, required: false }
              - { name: href, label: Order link, widget: string }
          - name: categories
            label: Shop by category
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Categories
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Name, widget: string }
                  - { name: href, label: Links to, widget: string }
          - name: cta
            label: Closing call to action
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }

      # ------------------------------------------------------------- about page
      - name: about
        label: About us page
        file: content/about.json
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: banner
            label: Page banner
            widget: object
            fields:
              - { name: crumb, label: Breadcrumb text, widget: string }
              - { name: heading, label: Heading, widget: string }
          - name: intro
            label: 'Section: Who we are'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: paragraphs, label: Paragraphs, widget: list, hint: 'Each entry becomes its own paragraph.' }
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Photo description, widget: string }
          - name: values
            label: 'Section: Why choose Wasay'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Cards
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: compliance
            label: 'Section: Quality and compliance'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - name: items
                label: Cards
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: cta
            label: Closing call to action
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }
