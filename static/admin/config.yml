# Sveltia CMS: the editor behind /admin on the Wasay Laboratories site.
#
# Saving here commits to the `main` branch on GitHub, which triggers a deploy.
#
# BEFORE THE EDITOR WILL WORK: replace both REPLACE-WITH-SITE-DOMAIN values below with the
# address this site is deployed at (see README, "Publishing and the editor").

backend:
  name: github
  repo: hamxakhanmk-a11y/wasaylab
  branch: main
  # Points at the OAuth endpoints in /api. See api/auth.js and api/callback.js.
  base_url: https://REPLACE-WITH-SITE-DOMAIN
  auth_endpoint: api/auth

site_url: https://REPLACE-WITH-SITE-DOMAIN
publish_mode: simple

# Photos live in the repo here and are served from /images.
media_folder: static/images
public_folder: /images

collections:
  # ---------------------------------------------------------------- every product
  # One entry per product (content/catalog/<slug>.json). Change "Which tab shows this product" to move a product to another tab; the
  # home page products are chosen in "Home page, which products show". Products cannot be added or deleted here because each one also
  # needs its 3D model and pictures made (see README, "Adding a product").
  - name: catalog
    label: Products
    label_singular: Product
    description: Every product on the site. Edit its name, text and tab here.
    folder: content/catalog
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} ({{tab}})'
    sortable_fields: [name, tab, order]
    view_groups:
      - { label: Tab, field: tab }
    view_filters:
      - { label: Tablets, field: tab, pattern: tablets }
      - { label: Multi Tonics, field: tab, pattern: tonics }
      - { label: Syrups, field: tab, pattern: syrups }
      - { label: Ointments, field: tab, pattern: ointments }
      - { label: Pastes, field: tab, pattern: pastes }
    editor:
      preview: false
    fields:
      - { name: name, label: Product name, widget: string }
      - name: tab
        label: Which tab shows this product
        widget: select
        options:
          - { label: Tablets, value: tablets }
          - { label: Multi Tonics, value: tonics }
          - { label: Syrups, value: syrups }
          - { label: Ointments, value: ointments }
          - { label: Pastes, value: pastes }
        hint: Switch this to move the product to another tab. It appears at the position set below.
      - { name: order, label: Position in its tab (smaller numbers come first), widget: number, value_type: int, min: 0, hint: 'Products are spaced 10 apart (10, 20, 30...). Use 15 to put one between the first two.' }
      - { name: detail, label: Size or pack line (shown under the name), widget: string, hint: 'e.g. 40 tablets, 120 ml' }
      - { name: about, label: About the product, widget: text }
      - { name: uses, label: Uses, widget: list, required: false, hint: 'One use per line. Leave empty if the label does not say.' }
      - { name: ingredients, label: Ingredients, widget: list, required: false, hint: 'Only what is readable on the pack.' }
      - { name: partial_composition, label: Only some of the ingredients are listed (shows the heading Key ingredients), widget: boolean, required: false }
      - { name: composition_note, label: Note on the ingredient list (not shown on the site), widget: text, required: false }
      - { name: uses_note, label: Note on the uses (not shown on the site), widget: text, required: false }
      - { name: evidence, label: Where the text comes from (not shown on the site), widget: text, required: false }
      - { name: slug, label: Address name, widget: hidden }
      - { name: kind, label: Kind of pack, widget: hidden }
      - { name: image, label: Photo, widget: hidden }
      - { name: motion, label: Special view, widget: hidden, required: false }
      - { name: composition_status, label: Composition evidence, widget: hidden, required: false }
      - { name: sources, label: Source photographs, widget: hidden, required: false }

  - name: content
    label: Website content
    editor:
      preview: false
    files:
      # ---------------------------------------------------------------- shared
      - name: site
        label: 'Shared: menu and footer'
        file: content/site.json
        description: Used on every page. Change it once and it updates site-wide.
        fields:
          - { name: name, label: Company name (used for logo descriptions), widget: string }
          - { name: logo, label: Logo, widget: image }
          - { name: favicon, label: Favicon (browser tab icon), widget: image }
          - name: shop
            label: Online shop
            widget: object
            fields:
              - { name: url, label: Shop address, widget: string }
              - { name: home_url, label: Main website address, widget: string }
          - name: nav
            label: Top menu
            widget: object
            fields:
              - name: links
                label: Menu items
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Links to, widget: string, hint: 'e.g. about.html' }
                  - name: slug
                    label: Page it belongs to
                    widget: select
                    options: [index, tablets, tonics, syrups, ointments, pastes, products, about, contact]
                    hint: Used to highlight this item when you are on that page.
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: blurb, label: Blurb under the logo, widget: text }
              - { name: company_heading, label: First column heading, widget: string }
              - name: company_links
                label: First column links
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Links to, widget: string }
              - { name: contact_heading, label: Heading of the contact column, widget: string, hint: 'The address, phone and emails under it come from the Contact page.' }
              - { name: copyright, label: Copyright line, widget: string, hint: 'The year and © are added automatically.' }
              - { name: tagline, label: Closing line, widget: string }

          - name: product_view
            label: Product view (opens when any product is clicked)
            widget: object
            hint: 'Use {name}, {detail}, {range}, {pack} in any text where the product''s own words should appear.'
            fields:
              - { name: back_label, label: Back button text, widget: string }
              - { name: close_label, label: Back button description for screen readers, widget: string }
              - { name: intro, label: Paragraph under the product, widget: text }
              - { name: specs_heading, label: Specifications heading, widget: string }
              - name: specs
                label: Specifications
                widget: list
                summary: '{{fields.label}}: {{fields.value}}'
                hint: Add rows such as composition once Wasay supplies them.
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string }
              - { name: prev_label, label: Previous button text, widget: string }
              - { name: next_label, label: Next button text, widget: string }
              - { name: nav_label, label: Previous / next description for screen readers, widget: string }
              - { name: facts_heading, label: At a glance (for screen readers), widget: string }
              - { name: range_label, label: 'At a glance: range', widget: string }
              - { name: size_label, label: 'At a glance: size', widget: string }
              - { name: pack_label, label: 'At a glance: pack', widget: string }
              - { name: made_label, label: 'At a glance: made by', widget: string }
              - { name: made_value, label: Maker shown on every product, widget: string }
              - { name: pack_jar, label: Pack of a jar, widget: string }
              - { name: pack_carton, label: Pack of a carton, widget: string }
              - { name: related_heading, label: Heading before the range name (More from ...), widget: string }
              - { name: range_link, label: Link text before the range name (See all ...), widget: string }
              - name: kinds
                label: Product ranges
                widget: list
                summary: '{{fields.range}}'
                fields:
                  - { name: key, label: Key (do not change), widget: string }
                  - { name: range, label: Range name, widget: string }
                  - { name: pack, label: Pack type, widget: string }
                  - { name: noun, label: Pack word (jar, carton), widget: string }
                  - { name: all_label, label: Link text to the whole range, widget: string }
                  - { name: all_href, label: Link goes to, widget: string }
      # ------------------------------------------------------------ home page
      - name: index
        label: Home page
        file: content/index.json
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: hero
            label: 'Section: Opening banner (the growing hill)'
            widget: object
            hint: The hill, the seedling and the flowers are drawn by the site itself; only the words are edited here.
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: lead, label: Line under the heading, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second link text, widget: string }
              - { name: secondary_href, label: Second link goes to, widget: string }
              - { name: pause_label, label: Pause button text, widget: string }
              - { name: play_label, label: Play button text, widget: string }
          - name: ranges
            label: 'Section: Our ranges (cards, one per tab)'
            widget: object
            hint: The cards themselves are made from the products, so they follow products moved between tabs.
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: link_label, label: Card link text, widget: string }
          - name: stats
            label: 'Section: Wasay at a glance (the grassy trunk and the capsule)'
            widget: object
            hint: The number of products and of ranges are counted automatically.
            fields:
              - { name: eyebrow, label: Big title over the trunk and the capsule, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: products_label, label: Words under the number of products, widget: string }
              - { name: ranges_label, label: Words under the number of ranges, widget: string }
              - name: facts
                label: More figures (only true ones)
                widget: list
                required: false
                summary: '{{fields.value}}'
                fields:
                  - { name: value, label: Big text, widget: string }
                  - { name: label, label: Words under it, widget: string }
          - name: ring
            label: 'Section: Product ring (under the opening banner)'
            widget: object
            hint: The jars come from the Pastes page. Each needs pictures in static/images/wasay/ring, made with scripts/render-cutouts.mjs.
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: label, label: Description for screen readers, widget: text }
              - { name: link_label, label: Button text, widget: string }
              - { name: link_href, label: Button links to, widget: string }
          - name: about
            label: 'Section: Who we are'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: points, label: Bullet points, widget: list }
              - { name: button_label, label: Button text, widget: string }
              - { name: button_href, label: Button links to, widget: string }
          - name: best_sellers
            label: 'Section: Best selling (products come from the Products page)'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: button_label, label: Button text, widget: string }
              - { name: button_href, label: Button links to, widget: string }
          - name: why
            label: 'Section: Why choose Wasay'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Reasons
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: cta
            label: 'Section: Closing call to action'
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }

      # ----------------------------------------------- products on the home page
      - name: home_products
        label: Home page, which products show
        file: content/home_products.json
        description: Pick the products that go round on the home page, in the order you want them (at least 3). Any product from any tab can be chosen.
        fields:
          - name: products
            label: Products shown on the home page
            widget: relation
            collection: catalog
            value_field: slug
            search_fields: [name, tab]
            display_fields: [name]
            multiple: true
            min: 3
            hint: Type a name to find a product. They appear on the home page in this order.

      # ------------------------------------------------------------ contact page
      - name: contact
        label: Contact page
        file: content/contact.json
        description: Fill in a detail and it appears on the Contact page; leave it empty and it is not shown. Only enter details that are correct.
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: banner
            label: Page banner
            widget: object
            fields:
              - { name: crumb, label: Breadcrumb text, widget: string }
              - { name: heading, label: Heading, widget: string }
          - name: intro
            label: Introduction
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
          - { name: address, label: Address, widget: text, required: false, hint: 'Press Enter for a new line.' }
          - { name: phone, label: Phone number, widget: string, required: false, hint: 'e.g. +92 91 1234567. Becomes a tap-to-call link.' }
          - { name: email, label: Email address, widget: string, required: false }
          - { name: email_other, label: Second email address, widget: string, required: false }
          - { name: hours, label: Opening hours, widget: text, required: false }
          - { name: map_url, label: Link to the address on a map (optional), widget: string, required: false }
          - { name: map_label, label: Map link text, widget: string }
          - name: links
            label: Find us online (WhatsApp, Facebook, Instagram, website...)
            widget: list
            required: false
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Text, widget: string }
              - { name: url, label: Full web address, widget: string, hint: 'Starts with https://' }
          - name: extra
            label: Other details (for example a second phone or a branch)
            widget: list
            required: false
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Title, widget: string }
              - { name: value, label: Text, widget: text }
          - { name: note, label: A note under the details, widget: text, required: false }
          - name: labels
            label: Card titles (change only to rename or translate)
            widget: object
            collapsed: true
            fields:
              - { name: company, label: Company card, widget: string }
              - { name: address, label: Address card, widget: string }
              - { name: phone, label: Phone card, widget: string }
              - { name: email, label: Email card, widget: string }
              - { name: hours, label: Opening hours card, widget: string }
              - { name: links, label: Online links title, widget: string }

      # ---------------------------------------------------------- products page
      - name: products
        label: Products page text
        file: content/products.json
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: banner
            label: Page banner
            widget: object
            fields:
              - { name: crumb, label: Breadcrumb text, widget: string }
              - { name: heading, label: Heading, widget: string }
          - name: intro
            label: Introduction
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
          - name: cta
            label: Closing call to action
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }

      # ------------------------------------------------------------- about page
      - name: about
        label: About us page
        file: content/about.json
        fields:
          - { name: title, label: Browser tab / search result title, widget: string }
          - { name: description, label: Search engine description, widget: text, hint: 'Aim for 150–160 characters.' }
          - name: banner
            label: Page banner
            widget: object
            fields:
              - { name: crumb, label: Breadcrumb text, widget: string }
              - { name: heading, label: Heading, widget: string }
          - name: intro
            label: 'Section: Who we are'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: paragraphs, label: Paragraphs, widget: list, hint: 'Each entry becomes its own paragraph.' }
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Photo description, widget: string }
          - name: story
            label: 'Section: Our story (from the company profile)'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: paragraphs, label: Paragraphs, widget: list, hint: 'Each entry becomes its own paragraph.' }
          - name: mission
            label: 'Section: Mission and vision'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: motto, label: Motto in Urdu, widget: string, required: false }
              - name: items
                label: Cards
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: objectives
            label: 'Section: Objectives'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: items, label: Objectives, widget: list, hint: 'One objective per entry; they are numbered.' }
          - name: keys
            label: 'Section: Keys to success'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: items, label: Keys, widget: list }
          - name: values
            label: 'Section: Why choose Wasay'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Cards
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: compliance
            label: 'Section: Quality and compliance'
            widget: object
            fields:
              - { name: eyebrow, label: Small label above heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - name: items
                label: Cards
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
          - name: cta
            label: Closing call to action
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Paragraph, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: primary_href, label: Main button links to, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }
              - { name: secondary_href, label: Second button links to, widget: string }

